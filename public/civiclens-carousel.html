<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CivicLens — 3D Department Carousel Ring</title>
    <style>
      /* Base layout & dark navy palette */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        min-height: 100%;
        background-color: #070d1c;
        color: #f4f7ff;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        overflow-x: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 28px 16px 36px;
        position: relative;
      }

      /* Soft radial violet glow behind the 3D ring */
      .ambient-glow {
        position: fixed;
        top: 50%;
        left: 50%;
        width: min(820px, 110vw);
        height: min(820px, 110vw);
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(139, 123, 255, 0.28) 0%,
          rgba(111, 76, 224, 0.14) 38%,
          rgba(7, 13, 28, 0) 72%
        );
        pointer-events: none;
        z-index: 0;
      }

      /* Header */
      .header {
        position: relative;
        z-index: 2;
        text-align: center;
        margin-bottom: 14px;
      }

      .brand-kicker {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9e93ff;
        margin-bottom: 6px;
      }

      .title {
        font-size: clamp(1.5rem, 3.2vw, 2.2rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
      }

      .subtitle {
        margin-top: 6px;
        font-size: 0.9rem;
        color: #9aa5be;
      }

      /* Responsive scaler so the 310px-radius ring fits narrow mobile screens */
      .carousel-scale {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 410px;
      }

      /* 3D perspective container with grab cursor and vertical scroll preservation */
      .carousel-container {
        width: 780px;
        height: 400px;
        perspective: 1200px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
      }

      .carousel-container.is-dragging {
        cursor: grabbing;
      }

      /* Whole stage tilted slightly downward (-8deg) */
      .stage {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        transform: rotateX(-8deg);
      }

      /* Glowing glass sphere in the center of the ring */
      .center-sphere {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 112px;
        height: 112px;
        border-radius: 50%;
        transform: translate3d(-50%, -50%, 0) rotateX(8deg);
        background:
          radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.72) 0%, rgba(255, 255, 255, 0.12) 22%, transparent 50%),
          radial-gradient(circle at 68% 72%, rgba(94, 224, 255, 0.35) 0%, rgba(139, 123, 255, 0.45) 55%, rgba(22, 18, 56, 0.85) 100%);
        border: 1px solid rgba(255, 255, 255, 0.34);
        box-shadow:
          0 0 36px rgba(139, 123, 255, 0.55),
          0 0 78px rgba(94, 224, 255, 0.25),
          inset 0 0 22px rgba(255, 255, 255, 0.26);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        animation: spherePulse 3.6s ease-in-out infinite;
        pointer-events: none;
      }

      @keyframes spherePulse {
        0%,
        100% {
          transform: translate3d(-50%, -50%, 0) rotateX(8deg) scale(1);
          box-shadow:
            0 0 36px rgba(139, 123, 255, 0.55),
            0 0 78px rgba(94, 224, 255, 0.25),
            inset 0 0 22px rgba(255, 255, 255, 0.26);
        }
        50% {
          transform: translate3d(-50%, -50%, 0) rotateX(8deg) scale(1.08);
          box-shadow:
            0 0 52px rgba(139, 123, 255, 0.82),
            0 0 110px rgba(94, 224, 255, 0.4),
            inset 0 0 28px rgba(255, 255, 255, 0.4);
        }
      }

      /* Rotating 3D ring */
      .ring {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        will-change: transform;
      }

      /* Individual glass card (200x260) */
      .card {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 200px;
        height: 260px;
        margin-left: -100px;
        margin-top: -130px;
        padding: 24px 18px 20px;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.1) 0%,
          rgba(16, 26, 52, 0.72) 52%,
          rgba(7, 13, 28, 0.9) 100%
        );
        box-shadow:
          0 16px 38px rgba(0, 0, 0, 0.55),
          0 0 28px var(--glow, rgba(139, 123, 255, 0.28)),
          inset 0 1px 0 rgba(255, 255, 255, 0.18);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        text-align: center;
        overflow: hidden;
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .card:hover {
        border-color: rgba(255, 255, 255, 0.42);
      }

      .card.is-selected {
        border-color: var(--accent, #5ee0ff);
        box-shadow:
          0 18px 42px rgba(0, 0, 0, 0.65),
          0 0 40px var(--glow, rgba(94, 224, 255, 0.55)),
          inset 0 0 18px rgba(255, 255, 255, 0.18);
      }

      /* Subtle accent tint at the top of each card */
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 18%,
          var(--glow, rgba(255, 255, 255, 0.12)) 0%,
          transparent 62%
        );
        opacity: 0.45;
        pointer-events: none;
      }

      .card-icon {
        position: relative;
        z-index: 1;
        font-size: 3.35rem;
        line-height: 1;
        margin-top: 8px;
        filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.45));
      }

      .card-body {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }

      .card-title {
        font-size: 1.25rem;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #ffffff;
      }

      .card-dept {
        font-size: 0.76rem;
        line-height: 1.35;
        color: #9ba6be;
        max-width: 158px;
      }

      .card-bar {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 4px;
        border-radius: 999px;
        background-color: var(--accent, #5ee0ff);
        box-shadow: 0 0 14px var(--accent, #5ee0ff);
      }

      /* Hint below the ring */
      .hint {
        position: relative;
        z-index: 2;
        margin-top: 8px;
        font-size: 0.85rem;
        color: #8f9bb5;
        letter-spacing: 0.01em;
        text-align: center;
      }

      /* Quick category tabs + complaint list panel */
      .quick-tabs {
        position: relative;
        z-index: 2;
        margin-top: 14px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        max-width: 960px;
      }

      .quick-tab {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(16, 26, 52, 0.65);
        color: #d6dff5;
        border-radius: 999px;
        padding: 6px 13px;
        font-size: 0.78rem;
        font-weight: 600;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: all 0.16s ease;
      }

      .quick-tab:hover {
        border-color: rgba(255, 255, 255, 0.35);
        color: #ffffff;
      }

      .quick-tab.is-active {
        background: var(--tab-accent, #5ee0ff);
        border-color: var(--tab-accent, #5ee0ff);
        color: #070d1c;
        font-weight: 700;
      }

      .complaints-panel {
        position: relative;
        z-index: 2;
        width: 100%;
        max-width: 980px;
        margin-top: 18px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(11, 18, 38, 0.92);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.45);
        overflow: hidden;
        display: none;
      }

      .complaints-panel.is-open {
        display: block;
      }

      .panel-header {
        padding: 14px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .panel-title-wrap {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .panel-emoji {
        font-size: 1.45rem;
      }

      .panel-title {
        font-size: 1rem;
        font-weight: 800;
        color: #ffffff;
      }

      .panel-sub {
        font-size: 0.78rem;
        color: #9ba6be;
        margin-top: 2px;
      }

      .panel-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .panel-count {
        font-size: 0.75rem;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(94, 224, 255, 0.12);
        color: #5ee0ff;
        border: 1px solid rgba(94, 224, 255, 0.25);
      }

      .panel-close {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.06);
        color: #cbd5e1;
        border-radius: 8px;
        padding: 5px 10px;
        font-size: 0.75rem;
        font-weight: 600;
        cursor: pointer;
      }

      .panel-close:hover {
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
      }

      .panel-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 12px;
        padding: 16px 18px 18px;
        max-height: 410px;
        overflow-y: auto;
      }

      .panel-empty {
        padding: 26px 18px;
        text-align: center;
        font-size: 0.86rem;
        color: #94a3b8;
      }

      .complaint-item {
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(19, 29, 58, 0.72);
        padding: 13px 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 10px;
      }

      .complaint-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .ticket-code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        font-weight: 700;
        color: #5ee0ff;
      }

      .sev-badge {
        font-size: 0.68rem;
        font-weight: 800;
        padding: 3px 8px;
        border-radius: 6px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
      }

      .sev-CRITICAL {
        background: rgba(239, 68, 68, 0.22);
        color: #fca5a5;
        border: 1px solid rgba(239, 68, 68, 0.45);
      }

      .sev-HIGH {
        background: rgba(249, 115, 22, 0.22);
        color: #fdba74;
        border: 1px solid rgba(249, 115, 22, 0.45);
      }

      .sev-MEDIUM {
        background: rgba(245, 158, 11, 0.2);
        color: #fde68a;
        border: 1px solid rgba(245, 158, 11, 0.4);
      }

      .sev-LOW {
        background: rgba(16, 185, 129, 0.2);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.4);
      }

      .complaint-summary {
        font-size: 0.84rem;
        font-weight: 600;
        line-height: 1.4;
        color: #f8fafc;
      }

      .complaint-loc {
        font-size: 0.74rem;
        color: #94a3b8;
        line-height: 1.35;
      }

      .complaint-footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 0.72rem;
        color: #cbd5e1;
      }

      .track-btn {
        appearance: none;
        border: none;
        background: rgba(94, 224, 255, 0.16);
        color: #5ee0ff;
        border-radius: 6px;
        padding: 4px 9px;
        font-size: 0.72rem;
        font-weight: 700;
        cursor: pointer;
      }

      .track-btn:hover {
        background: #5ee0ff;
        color: #070d1c;
      }

      /* Scale down cleanly on narrower viewports */
      @media (max-width: 820px) {
        .carousel-scale {
          height: 330px;
        }
        .carousel-container {
          transform: scale(0.76);
        }
      }

      @media (max-width: 560px) {
        .carousel-scale {
          height: 255px;
        }
        .carousel-container {
          transform: scale(0.54);
        }
      }

      @media (max-width: 390px) {
        .carousel-scale {
          height: 220px;
        }
        .carousel-container {
          transform: scale(0.45);
        }
      }

      /* Respect reduced-motion preference */
      @media (prefers-reduced-motion: reduce) {
        .center-sphere {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="ambient-glow" aria-hidden="true"></div>

    <header class="header">
      <p class="brand-kicker">CivicLens AI</p>
      <h1 class="title">Smart Department Routing Ring</h1>
      <p class="subtitle">AI-classified citizen complaints routed to municipal departments</p>
    </header>

    <div class="carousel-scale">
      <div
        id="carouselContainer"
        class="carousel-container"
        role="region"
        aria-label="CivicLens 3D rotating department carousel"
      >
        <div class="stage">
          <div class="center-sphere" aria-hidden="true"></div>
          <div id="carouselRing" class="ring"></div>
        </div>
      </div>
    </div>

    <p class="hint">Drag to rotate. Tap any department card or chip below to view live complaints.</p>

    <div id="quickTabs" class="quick-tabs" role="tablist" aria-label="Department complaint categories"></div>

    <section id="complaintsPanel" class="complaints-panel" aria-live="polite">
      <div class="panel-header">
        <div class="panel-title-wrap">
          <span id="panelEmoji" class="panel-emoji"></span>
          <div>
            <h2 id="panelTitle" class="panel-title"></h2>
            <p id="panelSub" class="panel-sub"></p>
          </div>
        </div>
        <div class="panel-actions">
          <span id="panelCount" class="panel-count"></span>
          <button id="panelCloseBtn" type="button" class="panel-close">Close</button>
        </div>
      </div>
      <div id="panelBody"></div>
    </section>

    <script>
      (function () {
        // Six CivicLens complaint categories and routed municipal departments
        const CARDS = [
          {
            title: "Roads",
            category: "Roads",
            emoji: "\uD83D\uDEE3\uFE0F",
            accent: "#ffd166",
            glow: "rgba(255, 209, 102, 0.34)",
            subtitle: "Public Works (Roads)",
          },
          {
            title: "Waste",
            category: "Waste Management",
            emoji: "\uD83D\uDDD1\uFE0F",
            accent: "#4fd8a8",
            glow: "rgba(79, 216, 168, 0.34)",
            subtitle: "Solid Waste Management",
          },
          {
            title: "Water",
            category: "Water Supply",
            emoji: "\uD83D\uDCA7",
            accent: "#5ee0ff",
            glow: "rgba(94, 224, 255, 0.34)",
            subtitle: "Water Supply and Sewerage Board",
          },
          {
            title: "Electricity",
            category: "Electricity",
            emoji: "\u26A1",
            accent: "#ff9a3c",
            glow: "rgba(255, 154, 60, 0.34)",
            subtitle: "Electricity Board",
          },
          {
            title: "Trees",
            category: "Trees",
            emoji: "\uD83C\uDF33",
            accent: "#8bd96b",
            glow: "rgba(139, 217, 107, 0.34)",
            subtitle: "Horticulture and Forest Cell",
          },
          {
            title: "Drainage",
            category: "Drainage",
            emoji: "\uD83C\uDF0A",
            accent: "#8b7bff",
            glow: "rgba(139, 123, 255, 0.36)",
            subtitle: "Storm Water Drain Department",
          },
        ];

        const container = document.getElementById("carouselContainer");
        const ring = document.getElementById("carouselRing");
        const quickTabs = document.getElementById("quickTabs");
        const panel = document.getElementById("complaintsPanel");
        const panelEmoji = document.getElementById("panelEmoji");
        const panelTitle = document.getElementById("panelTitle");
        const panelSub = document.getElementById("panelSub");
        const panelCount = document.getElementById("panelCount");
        const panelBody = document.getElementById("panelBody");
        const panelCloseBtn = document.getElementById("panelCloseBtn");

        let selectedCategory = null;
        let cachedComplaints = [];
        let isLoadingComplaints = false;
        const cardElements = [];
        const tabElements = [];

        function notifyParentHeight() {
          if (window.parent && window.parent !== window) {
            const h = Math.max(640, document.documentElement.scrollHeight);
            window.parent.postMessage({ type: "CIVICLENS_CAROUSEL_HEIGHT", height: h }, window.location.origin);
          }
        }

        function escapeText(str) {
          return String(str || "");
        }

        function renderPanel() {
          cardElements.forEach(function (entry) {
            entry.el.classList.toggle("is-selected", entry.card.category === selectedCategory);
          });
          tabElements.forEach(function (entry) {
            entry.el.classList.toggle("is-active", entry.card.category === selectedCategory);
          });

          if (!selectedCategory) {
            panel.classList.remove("is-open");
            notifyParentHeight();
            return;
          }

          const cardMeta = CARDS.find(function (c) {
            return c.category === selectedCategory;
          });
          if (!cardMeta) {
            return;
          }

          const matches = cachedComplaints.filter(function (c) {
            return c.category === selectedCategory;
          });

          panel.classList.add("is-open");
          panelEmoji.textContent = cardMeta.emoji;
          panelTitle.textContent = cardMeta.title + " — " + cardMeta.category;
          panelSub.textContent = cardMeta.subtitle;
          panelCount.textContent = isLoadingComplaints
            ? "Loading..."
            : matches.length + (matches.length === 1 ? " Complaint" : " Complaints");

          panelBody.innerHTML = "";

          if (isLoadingComplaints && cachedComplaints.length === 0) {
            const loadingMsg = document.createElement("div");
            loadingMsg.className = "panel-empty";
            loadingMsg.textContent = "Loading live municipal complaints for " + cardMeta.title + "...";
            panelBody.appendChild(loadingMsg);
            notifyParentHeight();
            return;
          }

          if (matches.length === 0) {
            const empty = document.createElement("div");
            empty.className = "panel-empty";
            empty.textContent = "No active complaints currently filed under " + cardMeta.category + ".";
            panelBody.appendChild(empty);
            notifyParentHeight();
            return;
          }

          const list = document.createElement("div");
          list.className = "panel-list";

          matches.forEach(function (item) {
            const cardEl = document.createElement("article");
            cardEl.className = "complaint-item";

            const top = document.createElement("div");
            top.className = "complaint-top";

            const code = document.createElement("span");
            code.className = "ticket-code";
            code.textContent = escapeText(item.ticket_id);

            const sev = document.createElement("span");
            sev.className = "sev-badge sev-" + escapeText(item.severity || "MEDIUM");
            sev.textContent = escapeText(item.severity) + " · " + escapeText(item.priority_score) + "/100";

            top.appendChild(code);
            top.appendChild(sev);

            const summary = document.createElement("p");
            summary.className = "complaint-summary";
            summary.textContent = escapeText(item.ai_summary || item.description);

            const loc = document.createElement("p");
            loc.className = "complaint-loc";
            loc.textContent = escapeText(item.ward) + " · " + escapeText(item.street_landmark);

            const footer = document.createElement("div");
            footer.className = "complaint-footer";

            const statusText = document.createElement("span");
            statusText.textContent =
              escapeText(item.status) +
              (item.assigned_crew ? " · " + escapeText(item.assigned_crew) : "");

            const trackBtn = document.createElement("button");
            trackBtn.type = "button";
            trackBtn.className = "track-btn";
            trackBtn.textContent = "Track Ticket ->";
            trackBtn.addEventListener("click", function () {
              if (window.parent && window.parent !== window) {
                window.parent.postMessage(
                  { type: "CIVICLENS_TRACK_TICKET", ticketId: item.ticket_id },
                  window.location.origin
                );
              } else {
                window.location.href = "/";
              }
            });

            footer.appendChild(statusText);
            footer.appendChild(trackBtn);

            cardEl.appendChild(top);
            cardEl.appendChild(summary);
            cardEl.appendChild(loc);
            cardEl.appendChild(footer);
            list.appendChild(cardEl);
          });

          panelBody.appendChild(list);
          notifyParentHeight();
        }

        async function fetchComplaints() {
          isLoadingComplaints = true;
          if (selectedCategory) {
            renderPanel();
          }
          try {
            const res = await fetch("/api/public/grid?includeDemo=true", { credentials: "include" });
            if (res.ok) {
              const data = await res.json();
              if (data && Array.isArray(data.nodes)) {
                cachedComplaints = data.nodes;
              }
            }
          } catch (_err) {
            // Keep cached list if offline
          } finally {
            isLoadingComplaints = false;
            if (selectedCategory) {
              renderPanel();
            }
          }
        }

        function selectCategory(category) {
          if (selectedCategory === category) {
            selectedCategory = null;
            renderPanel();
            return;
          }
          selectedCategory = category;
          renderPanel();
          fetchComplaints();
        }

        // Build and place the six cards evenly around the 3D circle
        const stepDeg = 360 / CARDS.length;
        CARDS.forEach(function (item, index) {
          const card = document.createElement("article");
          card.className = "card";
          card.setAttribute("role", "button");
          card.setAttribute("tabindex", "0");
          card.setAttribute("aria-label", "View " + item.title + " complaints");
          card.dataset.category = item.category;
          card.style.setProperty("--accent", item.accent);
          card.style.setProperty("--glow", item.glow);
          card.style.transform = "rotateY(" + index * stepDeg + "deg) translateZ(310px)";

          const icon = document.createElement("div");
          icon.className = "card-icon";
          icon.textContent = item.emoji;

          const body = document.createElement("div");
          body.className = "card-body";

          const title = document.createElement("h2");
          title.className = "card-title";
          title.textContent = item.title;

          const dept = document.createElement("p");
          dept.className = "card-dept";
          dept.textContent = item.subtitle;

          body.appendChild(title);
          body.appendChild(dept);

          const bar = document.createElement("div");
          bar.className = "card-bar";

          card.appendChild(icon);
          card.appendChild(body);
          card.appendChild(bar);
          ring.appendChild(card);

          card.addEventListener("keydown", function (e) {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              selectCategory(item.category);
            }
          });
          cardElements.push({ el: card, card: item });

          // Quick tab button below ring
          const tab = document.createElement("button");
          tab.type = "button";
          tab.className = "quick-tab";
          tab.style.setProperty("--tab-accent", item.accent);
          tab.textContent = item.emoji + " " + item.title;
          tab.addEventListener("click", function () {
            selectCategory(item.category);
          });
          quickTabs.appendChild(tab);
          tabElements.push({ el: tab, card: item });
        });

        panelCloseBtn.addEventListener("click", function () {
          selectedCategory = null;
          renderPanel();
        });

        // Preload complaints & subscribe to live updates
        fetchComplaints();
        if (typeof EventSource !== "undefined") {
          try {
            const sse = new EventSource("/api/events");
            sse.onmessage = function (msg) {
              try {
                const ev = JSON.parse(msg.data);
                if (ev && ev.type && ev.type !== "connected") {
                  fetchComplaints();
                }
              } catch (_e) {}
            };
          } catch (_e) {}
        }

        // Motion & rotation state (degrees and degrees/second)
        const AUTO_SPIN_SPEED = 11;
        const DRAG_SENSITIVITY = 0.34;
        const MOMENTUM_EASE = 2.6;

        const reducedMotionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
        let reduceMotion = reducedMotionQuery.matches;

        reducedMotionQuery.addEventListener("change", function (event) {
          reduceMotion = event.matches;
          if (reduceMotion && !isDragging) {
            velocity = 0;
          }
        });

        let angle = 0;
        let velocity = reduceMotion ? 0 : AUTO_SPIN_SPEED;
        let isDragging = false;
        let activePointerId = null;
        let lastX = 0;
        let downX = 0;
        let downY = 0;
        let downCardCategory = null;
        let lastMoveTime = 0;
        let lastFrameTime = performance.now();

        // Pointer drag + tap handlers with pointer capture
        container.addEventListener("pointerdown", function (e) {
          if (e.button !== undefined && e.button !== 0 && e.pointerType === "mouse") {
            return;
          }
          const cardEl = e.target && e.target.closest ? e.target.closest(".card") : null;
          downCardCategory = cardEl && cardEl.dataset ? cardEl.dataset.category : null;
          downX = e.clientX;
          downY = e.clientY;

          isDragging = true;
          activePointerId = e.pointerId;
          lastX = e.clientX;
          lastMoveTime = performance.now();
          velocity = 0;
          container.classList.add("is-dragging");
          container.setPointerCapture(e.pointerId);
        });

        container.addEventListener("pointermove", function (e) {
          if (!isDragging || e.pointerId !== activePointerId) {
            return;
          }
          const now = performance.now();
          const dx = e.clientX - lastX;
          const dt = Math.max(0.004, (now - lastMoveTime) / 1000);

          const deltaAngle = dx * DRAG_SENSITIVITY;
          angle += deltaAngle;

          // Smoothly track release momentum in degrees/second
          const instantVelocity = Math.max(-420, Math.min(420, deltaAngle / dt));
          velocity = velocity * 0.45 + instantVelocity * 0.55;

          lastX = e.clientX;
          lastMoveTime = now;
        });

        function endDrag(e) {
          if (!isDragging || e.pointerId !== activePointerId) {
            return;
          }
          const movedDist = Math.hypot(e.clientX - downX, e.clientY - downY);
          const tappedCategory = movedDist < 8 ? downCardCategory : null;

          isDragging = false;
          downCardCategory = null;
          if (container.hasPointerCapture(e.pointerId)) {
            container.releasePointerCapture(e.pointerId);
          }
          activePointerId = null;
          container.classList.remove("is-dragging");

          // Drop stale momentum if pointer rested before release
          if (performance.now() - lastMoveTime > 90) {
            velocity = reduceMotion ? 0 : AUTO_SPIN_SPEED;
          }

          if (tappedCategory) {
            selectCategory(tappedCategory);
          }
        }

        container.addEventListener("pointerup", endDrag);
        container.addEventListener("pointercancel", endDrag);

        // Main animation loop using requestAnimationFrame
        function animate(now) {
          const dt = Math.min(0.05, Math.max(0, (now - lastFrameTime) / 1000));
          lastFrameTime = now;

          if (!isDragging) {
            const targetSpeed = reduceMotion ? 0 : AUTO_SPIN_SPEED;
            // Ease momentum back to slow auto-spin
            velocity += (targetSpeed - velocity) * (1 - Math.exp(-MOMENTUM_EASE * dt));
            angle += velocity * dt;
          }

          ring.style.transform = "rotateY(" + angle.toFixed(3) + "deg)";
          requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);
      })();
    </script>
  </body>
</html>
